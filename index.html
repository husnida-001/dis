<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>car</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <nav class="nav">
        <div class="container">
          <div class="nav__wrapper">
            <img src="./Frame 993.svg" alt="logo" />
            <ul class="nav__ul">
              <li><a href="#">Become a renter</a></li>
              <li><a href="#">Rental deals</a></li>
              <li><a href="#">How it work</a></li>
            </ul>
            <div class="btn2">
              <button class="btn">sign in</button>
              <button class="btn">sign up</button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <div class="hero__wrapper">
            <div class="hero__cars">
              <div>
                <h1 class="">
                  Find, book and rent a car
                  <span class="hero__span">Easily</span>
                </h1>
                <p>
                  Get a car wherever and whenever you <br />need it with your
                  IOS and Android device.
                </p>
                <div>
                  <img src="./image 2 (1).svg" alt="" />
                  <img src="./image 3.jpg" alt="" />
                </div>
              </div>
              <div><img src="./car 2 1.png" alt="" /></div>
            </div>
            <div class="border">
              <div class="ol">
                <div>
                  <img src="./location.svg" alt="" />
                </div>
                <div>
                  <h3>Location</h3>
                  <p>Search your location</p>
                </div>
              </div>
              <div class="ol">
                <div>
                  <img src="./calendar.svg" alt="" />
                </div>
                <div>
                  <h3>Pickup date</h3>
                  <p>Tue 15 Feb, 09:00</p>
                </div>
              </div>
              <div class="ol">
                <div><img src="./calendar.svg" alt="" /></div>
                <div><h3>Return date</h3></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
